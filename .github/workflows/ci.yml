name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一個 PR 有新 push 時取消舊的 run，避免佔用 macOS runner 排隊名額。
# main 的 push 以 run_id 分組，每次都獨立執行、不會被取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  collector:
    name: collector (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v

  usagekit:
    name: UsageKit (Swift)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apple/UsageKit
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  relay:
    name: relay (Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # relay/ 尚未建立前自動跳過
      - id: check
        run: echo "exists=$([ -f relay/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - if: steps.check.outputs.exists == 'true'
        working-directory: relay
        run: npm ci && npm test
