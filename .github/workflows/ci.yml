name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一個 PR 有新 push 時取消舊的 run，避免佔用 macOS runner 排隊名額。
# main 的 push 以 run_id 分組，每次都獨立執行、不會被取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  collector:
    name: collector (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v

  collector-lint:
    name: collector (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lint.txt
      - run: ruff check .
      - run: mypy
      # Windows 專用的分支（system.py、Codex 的讀取執行緒）也要型別正確
      - run: mypy --platform win32

  collector-windows:
    name: collector (Windows)
    # Windows 收集器（ADR-0011、FR-48）：同一份程式在 Windows 上跑測試；bash／macOS 專用的測試會自動略過。
    # 另外解析 PowerShell 腳本、實際建立再移除工作排程，並以假的對話紀錄跑一次 --tokens-only
    runs-on: windows-latest
    defaults:
      run:
        working-directory: collector
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Windows 的 Python 沒有時區資料庫：裝 tzdata 讓解析 Claude 重置時間的測試能跑（docs/windows.md 也建議安裝）；
      # 沒有資料庫時的行為由 test_system 以 mock 測試
      - run: python -m pip install --disable-pip-version-check tzdata
      - run: python -m unittest -v
        env:
          AI_USAGE_MONITOR_HOME: ${{ runner.temp }}\aum-test-home
      - name: PowerShell scripts parse (Windows PowerShell 5.1)
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem windows\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; exit 1 }
          }
      - name: Tokens-only run with fake logs
        shell: pwsh
        run: |
          $home2 = Join-Path $env:RUNNER_TEMP 'aum-run'
          $claude = Join-Path $home2 'claude\projects\p'
          New-Item -ItemType Directory -Force -Path $claude | Out-Null
          $line = '{"type":"assistant","timestamp":"2026-10-20T01:00:00Z","requestId":"r1","message":{"id":"m1","model":"claude-opus-5-5","usage":{"input_tokens":3,"output_tokens":4}}}'
          Set-Content -Path (Join-Path $claude '11111111-1111-4111-8111-111111111111.jsonl') -Value $line -Encoding utf8NoBOM
          $env:AI_USAGE_MONITOR_HOME = $home2
          $env:CLAUDE_CONFIG_DIR = Join-Path $home2 'claude'
          $env:CODEX_HOME = Join-Path $home2 'codex'
          python -X utf8 -m usage_collector --tokens-only --quiet --log-file (Join-Path $home2 'collector.log')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $check = "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); t=c.execute('SELECT SUM(input_tokens+output_tokens) FROM daily_tokens').fetchone()[0]; print('tokens', t); sys.exit(0 if t == int(sys.argv[2]) else 1)"
          python -X utf8 -c $check (Join-Path $home2 'history.sqlite3') 7
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 第二次執行（資料庫已存在）也要繼續統計
          Add-Content -Path (Join-Path $claude '11111111-1111-4111-8111-111111111111.jsonl') -Value $line.Replace('"r1"', '"r2"').Replace('"m1"', '"m2"') -Encoding utf8NoBOM
          python -X utf8 -m usage_collector --tokens-only --quiet --log-file (Join-Path $home2 'collector.log')
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $home2 'collector.log'); exit 1 }
          python -X utf8 -c $check (Join-Path $home2 'history.sqlite3') 14
      # Windows PowerShell 5.1 reads the step script in the ANSI code page: keep these steps ASCII-only
      - name: Install and remove the scheduled task
        shell: powershell
        run: |
          .\windows\install-task.ps1 -Python (Get-Command python).Source
          $task = Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'Collector'
          $task.Actions | Format-List Execute, Arguments, WorkingDirectory
          if ($task.Actions[0].Arguments -notmatch '--tokens-only') { throw 'expected --tokens-only by default' }
          .\windows\uninstall-task.ps1
          if (Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'Collector' -ErrorAction SilentlyContinue) { throw 'task was not removed' }
      - name: Install with -WithQuota (picks codex.cmd over codex.ps1, writes the config)
        shell: powershell
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'fake-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Set-Content (Join-Path $bin 'codex.ps1') 'exit 1'
          Set-Content (Join-Path $bin 'codex.cmd') '@exit /b 1'
          $env:PATH = "$bin;$env:PATH"
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP 'custom-codex'
          .\windows\install-task.ps1 -WithQuota -Python (Get-Command python).Source
          $config = Get-Content (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\config.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $config | Format-List
          if ($config.codex_path -notlike '*\codex.cmd') { throw "codex_path should be codex.cmd: $($config.codex_path)" }
          if (@($config.enabled_providers) -notcontains 'codex') { throw 'enabled_providers lacks codex' }
          if ($config.codex_home -ne $env:CODEX_HOME) { throw 'codex_home missing from config.json' }
          $task = Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'Collector'
          if ($task.Actions[0].Arguments -notmatch '--write-local') { throw '-WithQuota should run with --write-local' }
          .\windows\uninstall-task.ps1

  scripts:
    name: scripts (shell 腳本)
    # install-mac-app.sh 的完整流程只在 macOS 跑（ditto、defaults），這裡跑其餘的檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check-readme-images.py 以提交時間比較截圖與基準的新舊
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check-debug-env.py
      - name: README 的截圖（比基準舊時只顯示警告）
        run: python scripts/check-readme-images.py

  usagekit:
    name: UsageKit (Swift)
    # macOS runner 經常排不到（容量不足被取消），改用 Linux 容器；
    # SwiftUI 元件只在 Apple 平台編譯，由本機建置 iOS App 確認
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: apple/UsageKit
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  relay:
    name: relay (Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # relay/ 尚未建立前自動跳過
      - id: check
        run: echo "exists=$([ -f relay/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - if: steps.check.outputs.exists == 'true'
        working-directory: relay
        run: npm ci && npm test

  apple:
    name: Apple apps (${{ matrix.project }})
    # 編譯三個 App 與它們的擴充，抓 SwiftUI、Info.plist、XcodeGen 與 target membership 錯誤（C-11）。
    # macOS runner 經常排不到或被取消，所以這個 job 不設為必要檢查；Release 建置與
    # 「Release 不含 Debug 字串」的檢查仍以本機 scripts/verify-all.sh 為準
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: iOSApp, xcodeproj: AIUsageMonitor, destination: "generic/platform=iOS Simulator", appex: "Debug-iphonesimulator/AIUsageMonitor.app/PlugIns/UsageWidget.appex" }
          - { project: MacMenuBar, xcodeproj: AIUsageMenuBar, destination: "platform=macOS", appex: "" }
          - { project: WatchApp, xcodeproj: AIUsageWatch, destination: "generic/platform=watchOS Simulator", appex: "Debug-watchsimulator/AIUsageWatch.app/PlugIns/UsageComplications.appex" }
    steps:
      - uses: actions/checkout@v4
      # 用 runner 上最新的正式版 Xcode（略過 beta），部署目標需要 iOS 18／watchOS 11 SDK 以上
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Build (Debug)
        working-directory: apple/${{ matrix.project }}
        run: |
          xcodegen generate --quiet
          xcodebuild -project ${{ matrix.xcodeproj }}.xcodeproj -scheme ${{ matrix.xcodeproj }} \
            -configuration Debug -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
      # 截圖比對（只比 Mac）：runner 的 macOS／Xcode 和基準不同時只印警告，差異圖放在 artifact
      - name: Snapshots
        if: matrix.project == 'MacMenuBar'
        run: |
          SNAPSHOT_PLATFORMS=mac SNAPSHOT_MAC_APP="$RUNNER_TEMP/dd/Build/Products/Debug/AIUsageMenuBar.app" \
            scripts/snapshots.sh
      - if: matrix.project == 'MacMenuBar' && always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshots/
          if-no-files-found: ignore
      # Mac 沒有擴充（桌面小工具已移除）
      - name: Extension is embedded
        if: matrix.appex != ''
        run: test -d "$RUNNER_TEMP/dd/Build/Products/${{ matrix.appex }}"
