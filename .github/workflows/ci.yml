name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 同一個 PR 有新 push 時取消舊的 run，避免佔用 macOS runner 排隊名額。
# main 的 push 以 run_id 分組，每次都獨立執行、不會被取消。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  collector:
    name: collector (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest -v

  collector-lint:
    name: collector (ruff + mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lint.txt
      - run: ruff check .
      - run: mypy
      # Windows 專用的分支（system.py、Codex 的讀取執行緒）也要型別正確
      - run: mypy --platform win32

  collector-windows:
    name: collector (Windows)
    # Windows 收集器（ADR-0011、FR-48）：同一份程式在 Windows 上跑測試；bash／macOS 專用的測試會自動略過。
    # 另外解析 PowerShell 腳本、實際建立再移除工作排程，並以假的對話紀錄跑一次 --tokens-only
    runs-on: windows-latest
    defaults:
      run:
        working-directory: collector
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Windows 的 Python 沒有時區資料庫：裝 tzdata 讓解析 Claude 重置時間的測試能跑（docs/windows.md 也建議安裝）；
      # 沒有資料庫時的行為由 test_system 以 mock 測試
      - run: python -m pip install --disable-pip-version-check tzdata
      - run: python -m unittest -v
        env:
          AI_USAGE_MONITOR_HOME: ${{ runner.temp }}\aum-test-home
      - name: PowerShell scripts parse (Windows PowerShell 5.1)
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem windows\*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | Format-List; exit 1 }
          }
      - name: Tokens-only run with fake logs
        shell: pwsh
        run: |
          $home2 = Join-Path $env:RUNNER_TEMP 'aum-run'
          $claude = Join-Path $home2 'claude\projects\p'
          New-Item -ItemType Directory -Force -Path $claude | Out-Null
          $line = '{"type":"assistant","timestamp":"2026-10-20T01:00:00Z","requestId":"r1","message":{"id":"m1","model":"claude-opus-5-5","usage":{"input_tokens":3,"output_tokens":4}}}'
          Set-Content -Path (Join-Path $claude '11111111-1111-4111-8111-111111111111.jsonl') -Value $line -Encoding utf8NoBOM
          $env:AI_USAGE_MONITOR_HOME = $home2
          $env:CLAUDE_CONFIG_DIR = Join-Path $home2 'claude'
          $env:CODEX_HOME = Join-Path $home2 'codex'
          # 診斷：列舉時的 stat 與開檔後的 fstat 是否一致（不同磁碟區、檔案系統）
          $ident = "import os,sys; p=sys.argv[1]; a=os.stat(p, follow_symlinks=False); fd=os.open(p, os.O_RDONLY|getattr(os,'O_BINARY',0)); b=os.fstat(fd); os.close(fd); print('stat', a.st_dev, a.st_ino, 'fstat', b.st_dev, b.st_ino)"
          python -X utf8 -c $ident (Join-Path $claude '11111111-1111-4111-8111-111111111111.jsonl')
          python -X utf8 -m usage_collector --tokens-only --quiet --log-file (Join-Path $home2 'collector.log')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path (Join-Path $home2 'collector.log')) { Get-Content (Join-Path $home2 'collector.log') }
          $check = "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); t=c.execute('SELECT SUM(input_tokens+output_tokens) FROM daily_tokens').fetchone()[0]; print('tokens', t); sys.exit(0 if t == int(sys.argv[2]) else 1)"
          python -X utf8 -c $check (Join-Path $home2 'history.sqlite3') 7
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # 第二次執行（資料庫已存在）也要繼續統計
          Add-Content -Path (Join-Path $claude '11111111-1111-4111-8111-111111111111.jsonl') -Value $line.Replace('"r1"', '"r2"').Replace('"m1"', '"m2"') -Encoding utf8NoBOM
          python -X utf8 -m usage_collector --tokens-only --quiet --log-file (Join-Path $home2 'collector.log')
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $home2 'collector.log'); exit 1 }
          python -X utf8 -c $check (Join-Path $home2 'history.sqlite3') 14
      # Windows PowerShell 5.1 reads the step script in the ANSI code page: keep these steps ASCII-only
      - name: Install and remove the scheduled task
        shell: powershell
        run: |
          .\windows\install-task.ps1 -Python (Get-Command python).Source
          $task = Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'Collector'
          $task.Actions | Format-List Execute, Arguments, WorkingDirectory
          if ($task.Actions[0].Arguments -notmatch '--tokens-only') { throw 'expected --tokens-only by default' }
          $sync = Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'AgentSync'
          if ($sync.Actions[0].Arguments -notmatch '--agent-sync') { throw 'AgentSync should run --agent-sync' }
          if (@($sync.Triggers).Count -ne 0) { throw 'AgentSync should have no triggers (the app runs it)' }
          .\windows\uninstall-task.ps1
          if (Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'Collector' -ErrorAction SilentlyContinue) { throw 'task was not removed' }
          if (Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'AgentSync' -ErrorAction SilentlyContinue) { throw 'AgentSync was not removed' }
      - name: Install with -WithQuota (picks codex.cmd over codex.ps1, writes the config)
        shell: powershell
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'fake-bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Set-Content (Join-Path $bin 'codex.ps1') 'exit 1'
          Set-Content (Join-Path $bin 'codex.cmd') '@exit /b 1'
          $env:PATH = "$bin;$env:PATH"
          # a space plus a trailing backslash: PowerShell 5.1 would pass it as an escaped quote
          $codexHome = Join-Path $env:RUNNER_TEMP 'custom codex'
          $env:CODEX_HOME = $codexHome + '\'
          .\windows\install-task.ps1 -WithQuota -Python (Get-Command python).Source
          $config = Get-Content (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\config.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          $config | Format-List
          if ($config.codex_path -notlike '*\codex.cmd') { throw "codex_path should be codex.cmd: $($config.codex_path)" }
          if (@($config.enabled_providers) -notcontains 'codex') { throw 'enabled_providers lacks codex' }
          if ($config.codex_home -ne $codexHome) { throw "codex_home should be $codexHome : $($config.codex_home)" }
          $task = Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'Collector'
          if ($task.Actions[0].Arguments -notmatch '--write-local') { throw '-WithQuota should run with --write-local' }
          .\windows\uninstall-task.ps1
      # set-tier2.ps1 (ADR-0015 section 3): keys go through stdin (python reads one line when stdin is not a
      # console), into a temporary LOCALAPPDATA. One key per run: python may buffer more than one line.
      # Fake keys only; the credential targets are deleted at the end.
      - name: set-tier2.ps1 modes with piped keys
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'aum-tier2'
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA | Out-Null
          $py = (Get-Command python).Source
          $device = 'aumd_' + ('A1b2-C3d4_' * 4) + 'xyz'
          $read = 'RL4aesydLJXpCzwcEsNc7WDCww9cZEf6RVTmmGY5G2I='
          function Run-Tier2([string]$Stdin, [string]$Extra) {
            $file = Join-Path $env:RUNNER_TEMP 'aum-stdin.txt'
            Set-Content -Path $file -Value $Stdin -Encoding ascii
            cmd /c "type `"$file`" | powershell -NoProfile -ExecutionPolicy Bypass -File windows\set-tier2.ps1 -Python `"$py`" -RelayUrl https://relay.example.test $Extra" | Out-Host
            return $LASTEXITCODE
          }
          function Has([string]$Name) { python -X utf8 -m usage_collector.credentials has $Name | Out-Host; return $LASTEXITCODE -eq 0 }
          # a wrong key three times: nothing stored, non-zero exit
          if ((Run-Tier2 "aumd_short`r`nfoo`r`nbar" '-NoReadKey') -eq 0) { throw 'a malformed key should fail' }
          if (Has 'device-key') { throw 'a malformed key was stored' }
          # surrounding spaces and CRLF are trimmed; upload only
          if ((Run-Tier2 "  $device  " '-NoReadKey') -ne 0) { throw 'storing the device key failed' }
          if (-not (Has 'device-key')) { throw 'device key missing' }
          if (Has 'relay-read') { throw 'read key should not exist' }
          # keep the device key, add the read key
          if ((Run-Tier2 $read '-KeepDeviceKey -ReadKey') -ne 0) { throw '-KeepDeviceKey -ReadKey failed' }
          if (-not (Has 'relay-read')) { throw 'read key missing after -ReadKey' }
          # neither switch leaves the read key alone
          if ((Run-Tier2 $device '') -ne 0) { throw 'storing the device key again failed' }
          if (-not (Has 'relay-read')) { throw 'the read key should be kept without -NoReadKey' }
          # a device key pasted as the read key is refused
          if ((Run-Tier2 "$device`r`n" '-KeepDeviceKey -ReadKey') -eq 0) { throw 'a device key as the read key should fail' }
          if ((Run-Tier2 '' '-KeepDeviceKey -NoReadKey') -ne 0) { throw '-NoReadKey failed' }
          if (Has 'relay-read') { throw 'read key should be deleted by -NoReadKey' }
          $config = Get-Content (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\config.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($config.token_sync -ne $true -or $config.relay_url -ne 'https://relay.example.test') { throw "unexpected config: $($config | ConvertTo-Json)" }
          # AI 狀態同步（ADR-0019）：只開關 config.json 的 agent_sync，-NoAgentSync 刪除本機的其他電腦狀態
          if ((Run-Tier2 '' '-AgentSync') -ne 0) { throw '-AgentSync failed' }
          $config = Get-Content (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\config.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($config.agent_sync -ne $true) { throw 'agent_sync should be true after -AgentSync' }
          Set-Content (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\agent-remote.json') '{}'
          if ((Run-Tier2 '' '-NoAgentSync') -ne 0) { throw '-NoAgentSync failed' }
          $config = Get-Content (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\config.json') -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($config.agent_sync -ne $false) { throw 'agent_sync should be false after -NoAgentSync' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\agent-remote.json')) { throw '-NoAgentSync should delete agent-remote.json' }
          # the keys never reach a log or the config file
          foreach ($f in Get-ChildItem -Recurse -File $env:LOCALAPPDATA) {
            $text = [IO.File]::ReadAllText($f.FullName)
            if ($text.Contains($device) -or $text.Contains($read)) { throw "a key was written to $($f.Name)" }
          }
          python -X utf8 -m usage_collector.credentials delete device-key
          python -X utf8 -m usage_collector.credentials delete relay-read
      # One-line installer (scripts/install.ps1): package the release zip, then install into a temporary
      # LOCALAPPDATA from the local zip (no download), check the SHA-256 refusal, the iex path and uninstall
      - name: install.ps1 from the release zip
        shell: powershell
        working-directory: .
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'aum-release'
          python scripts\package-windows.py --version 0.0.1 --out $out
          if ($LASTEXITCODE -ne 0) { throw 'package-windows.py failed' }
          $zip = Join-Path $out 'AIUsageMonitor-collector-0.0.1.zip'
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash
          $installer = Join-Path $out 'install.ps1'
          if (-not (Select-String -Path $installer -SimpleMatch "'0.0.1'" -Quiet)) { throw 'version not written' }
          if (-not (Select-String -Path $installer -SimpleMatch "'$($sha.ToLower())'" -Quiet)) { throw 'sha not written' }
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'aum-localappdata'
          # wrong SHA-256: nothing installed
          $failed = $false
          try { & $installer -Zip $zip -Sha256 ('0' * 64) -NoTask } catch { $failed = $true; Write-Host "refused: $_" }
          if (-not $failed) { throw 'SHA mismatch was not refused' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\app')) { throw 'installed despite SHA mismatch' }
          # real install with the task, then a reinstall (old copy moves to app.old)
          & $installer -Zip $zip -Sha256 $sha
          $task = Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'Collector'
          if ($task.Actions[0].WorkingDirectory -notlike "$env:LOCALAPPDATA\AIUsageMonitor\app\collector") { throw "working directory: $($task.Actions[0].WorkingDirectory)" }
          & $installer -Zip $zip -Sha256 $sha -NoTask
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\app.old'))) { throw 'app.old missing' }
          # a collector still holding a file in app\collector (as right after the task ran): -Uninstall waits and
          # retries until the lock is released (ADR-0014 LT-27)
          $locked = Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\app\collector\usage_collector\__init__.py'
          $holder = Start-Process powershell.exe -PassThru -WindowStyle Hidden -ArgumentList '-NoProfile', '-Command', "`$f = [IO.File]::Open('$locked', 'Open', 'Read', 'None'); Start-Sleep -Seconds 4; `$f.Close()"
          Start-Sleep -Seconds 1
          if ($holder.HasExited) { throw 'the lock holder exited before -Uninstall' }
          & $installer -Uninstall
          $holder.WaitForExit()
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\app')) { throw 'app was not removed after the lock was released' }
          # a fresh window under the Restricted policy (the Windows default): the in-memory installer still registers
          # the task, and the persistent policy is unchanged
          $before = (Get-ExecutionPolicy -List | Out-String)
          powershell.exe -NoProfile -ExecutionPolicy Restricted -Command "& ([scriptblock]::Create((Get-Content -Raw '$installer'))) -Zip '$zip' -Sha256 '$sha'"
          if ($LASTEXITCODE -ne 0) { throw "install under Restricted failed: $LASTEXITCODE" }
          if (-not (Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'Collector' -ErrorAction SilentlyContinue)) { throw 'no task under Restricted' }
          if ((Get-ExecutionPolicy -List | Out-String) -ne $before) { throw 'execution policy changed' }
          # the repo copy has no version: through iex it must stop with a message, not close the session,
          # and leave nothing in this scope (its parameters and function stay inside one script block)
          $msg = ''
          $Version = 'kept'
          try { Get-Content scripts\install.ps1 -Raw | Invoke-Expression } catch { $msg = "$_" }
          if ($msg -notlike '*has no version*') { throw "unexpected iex result: $msg" }
          if ($zip -ne (Join-Path $out 'AIUsageMonitor-collector-0.0.1.zip') -or $Version -ne 'kept') { throw 'iex changed variables in this scope' }
          foreach ($name in 'WithQuota', 'Uninstall', 'Sha256', 'NoTask') { if (Test-Path "variable:$name") { throw "iex left `$$name" } }
          if (Get-Command Install-AIUsageCollector -ErrorAction SilentlyContinue) { throw 'iex left the installer function' }
          & $installer -Uninstall
          if (Get-ScheduledTask -TaskPath '\AIUsageMonitor\' -TaskName 'Collector' -ErrorAction SilentlyContinue) { throw 'task was not removed' }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\app')) { throw 'app was not removed' }

  scripts:
    name: scripts (shell 腳本)
    # install-mac-app.sh 的完整流程只在 macOS 跑（ditto、defaults），這裡跑其餘的檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s scripts/tests -v
      - run: python scripts/check-debug-env.py
      - name: README 的截圖（比基準舊時只顯示警告）
        run: python scripts/check-readme-images.py

  usagekit:
    name: UsageKit (Swift)
    # macOS runner 經常排不到（容量不足被取消），改用 Linux 容器；
    # SwiftUI 元件只在 Apple 平台編譯，由本機建置 iOS App 確認
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        working-directory: apple/UsageKit
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test

  relay:
    name: relay (Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # relay/ 尚未建立前自動跳過
      - id: check
        run: echo "exists=$([ -f relay/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - if: steps.check.outputs.exists == 'true'
        working-directory: relay
        run: npm ci && npm test

  apple:
    name: Apple apps (${{ matrix.project }})
    # 編譯三個 App 與它們的擴充，抓 SwiftUI、Info.plist、XcodeGen 與 target membership 錯誤（C-11）。
    # macOS runner 經常排不到或被取消，所以這個 job 不設為必要檢查；Release 建置與
    # 「Release 不含 Debug 字串」的檢查仍以本機 scripts/verify-all.sh 為準
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: iOSApp, xcodeproj: AIUsageMonitor, destination: "generic/platform=iOS Simulator", appex: "Debug-iphonesimulator/AIUsageMonitor.app/PlugIns/UsageWidget.appex" }
          - { project: MacMenuBar, xcodeproj: AIUsageMenuBar, destination: "platform=macOS", appex: "" }
          - { project: WatchApp, xcodeproj: AIUsageWatch, destination: "generic/platform=watchOS Simulator", appex: "Debug-watchsimulator/AIUsageWatch.app/PlugIns/UsageComplications.appex" }
    steps:
      - uses: actions/checkout@v4
      # 用 runner 上最新的正式版 Xcode（略過 beta），部署目標需要 iOS 18／watchOS 11 SDK 以上
      - name: Select Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install xcodegen
      - name: Build (Debug)
        working-directory: apple/${{ matrix.project }}
        run: |
          xcodegen generate --quiet
          xcodebuild -project ${{ matrix.xcodeproj }}.xcodeproj -scheme ${{ matrix.xcodeproj }} \
            -configuration Debug -destination '${{ matrix.destination }}' \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build
      # 截圖比對（只比 Mac）：runner 的 macOS／Xcode 和基準不同時只印警告，差異圖放在 artifact
      - name: Snapshots
        if: matrix.project == 'MacMenuBar'
        run: |
          SNAPSHOT_PLATFORMS=mac SNAPSHOT_MAC_APP="$RUNNER_TEMP/dd/Build/Products/Debug/AIUsageMenuBar.app" \
            scripts/snapshots.sh
      - if: matrix.project == 'MacMenuBar' && always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshots/
          if-no-files-found: ignore
      # Mac 沒有擴充（桌面小工具已移除）
      - name: Extension is embedded
        if: matrix.appex != ''
        run: test -d "$RUNNER_TEMP/dd/Build/Products/${{ matrix.appex }}"

  usagecore:
    name: UsageCore (C#)
    # Windows App 的純邏輯（ADR-0015 第 4 節）：和 UsageKit 共用 fixtures/logic 的 golden；另做不連網的靜態檢查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test windows/tests/UsageCore.Tests
      - run: python3 windows/tools/check-no-network.py

  windows-app:
    name: Windows App
    # 建置 x64 與 ARM64 的 Release、確認 Release 不含 Debug 專用字串，以 Debug 版產生截圖、以 Release 版量測效能，
    # 再實際跑一次 install-windows-app.ps1（安裝、更新、移除）。截圖與效能結果放在 artifact（ADR-0015 第 7、8 節）
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test windows/tests/UsageCore.Tests
      - name: Build Release (x64, ARM64) without Debug strings
        run: |
          foreach ($rid in 'win-x64', 'win-arm64') {
            dotnet publish windows/src/AIUsageMonitor.Windows -c Release -r $rid --self-contained false -o "$env:RUNNER_TEMP\rel-$rid"
            if ($LASTEXITCODE) { exit 1 }
            python windows/tools/check-no-network.py --release "$env:RUNNER_TEMP\rel-$rid"
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: Screenshots (Debug build, fixed time)
        run: |
          dotnet build windows/src/AIUsageMonitor.Windows -c Debug -r win-x64 -o "$env:RUNNER_TEMP\dbg"
          if ($LASTEXITCODE) { exit 1 }
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\dbg\AIUsageMonitor.exe" -ArgumentList '--render', 'build\win-screens', '--now', '2026-10-26T09:30:00Z' `
            -PassThru -Wait -RedirectStandardOutput "$env:RUNNER_TEMP\render.out" -RedirectStandardError "$env:RUNNER_TEMP\render.err"
          Get-Content "$env:RUNNER_TEMP\render.out", "$env:RUNNER_TEMP\render.err"
          if ($p.ExitCode -ne 0) { exit 1 }
          Get-ChildItem build\win-screens | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-screens
          path: build/win-screens/
          if-no-files-found: ignore
      - name: Performance (Release x64)
        run: |
          windows/tools/measure-perf.ps1 -Exe "$env:RUNNER_TEMP\rel-win-x64\AIUsageMonitor.exe" -Output build\perf.md -Ci
          $code = $LASTEXITCODE
          Get-Content build\perf.md | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-perf
          path: build/perf.md
          if-no-files-found: ignore
      - name: install-windows-app.ps1 (install, update, uninstall)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\WindowsApp'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          & .\scripts\install-windows-app.ps1 -NoStart
          if (-not (Test-Path "$app\AIUsageMonitor.exe")) { throw 'not installed' }
          if ((Get-ItemProperty $run).AIUsageMonitor -ne "`"$app\AIUsageMonitor.exe`"") { throw 'autostart missing' }
          # 設定關掉開機自動啟動後再跑一次（更新）：依設定移除登錄值，舊版改名 WindowsApp.old
          Set-Content (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\windows-app.json') '{"launch_at_login": false}' -Encoding UTF8
          & .\scripts\install-windows-app.ps1 -NoStart
          if ((Get-ItemProperty $run).PSObject.Properties.Name -contains 'AIUsageMonitor') { throw 'autostart should be off' }
          if (-not (Test-Path "$app.old\AIUsageMonitor.exe")) { throw 'old version not kept' }
          & .\scripts\install-windows-app.ps1 -Uninstall
          if (Test-Path $app) { throw 'not removed' }
          if (-not (Test-Path (Join-Path $env:LOCALAPPDATA 'AIUsageMonitor\windows-app.json'))) { throw 'settings should be kept' }
