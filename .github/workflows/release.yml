# 發布流程（ADR-0013 第 7 節）：
# - 推 v* tag：建置 Mac 的 .zip、.dmg、install.sh、SHA256SUMS，以及 Windows App 的自含式 zip（x64、ARM64）與 SHA256SUMS-windows，
#   產生建置來源證明，建立「草稿」Release（要人到 GitHub 按發布）
# - workflow_dispatch：同樣的建置，只上傳成 workflow artifact，不建立 Release、不產生證明
# - pull_request（只在發布相關檔案改動時）：確認建置與檢查會過；刪除 artifact 的步驟以一個小的假 artifact 乾跑
# - 草稿建立後（或任何一個 job 失敗時）刪除這次執行的所有 workflow artifact：repo 是公開的，artifact 任何登入 GitHub 的人都能
#   下載，不刪的話草稿還沒發布檔案就公開了（ADR-0013 第 7 節）。artifact 也只保留 1 天，刪除失敗時最多公開 1 天
# 第三方 action 一律固定到 commit SHA；預設只有讀取權限，建立草稿的 job 才有寫入權限，刪除 artifact 的 job 才有 actions: write。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-release.sh
      - scripts/bundle-collector.sh
      - scripts/fetch-python-runtime.sh
      - scripts/install.sh
      - scripts/install.ps1
      - scripts/package-windows.py
      - scripts/package-windows-app.py
      - apple/MacMenuBar/LaunchAgent/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Mac App（zip、dmg、install.sh）
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 選擇 Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - run: brew install xcodegen
      - name: 版本
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' apple/MacMenuBar/project.yml | head -1)
          fi
          # tag 名稱直接進 shell 之前先檢查格式（build-release.sh 也會再檢查一次）
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "版本格式不對：$version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: 建置
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/build-release.sh --version "$VERSION" --out build/release/out
      - name: 檢查產出
        working-directory: build/release/out
        env:
          v: ${{ steps.version.outputs.version }}
        run: |
          shasum -a 256 -c SHA256SUMS
          grep -q "^VERSION=\"$v\"$" install.sh
          grep -q "^ZIP_SHA256=\"$(shasum -a 256 AIUsageMenuBar-$v.zip | awk '{print $1}')\"$" install.sh
          grep -q "'$(shasum -a 256 AIUsageMonitor-collector-$v.zip | awk '{print $1}')'" install.ps1
          # 從 zip 安裝到暫存資料夾（不打開 App）
          tmp=$(mktemp -d)
          AUM_INSTALL_DIR="$tmp" AUM_ZIP="AIUsageMenuBar-$v.zip" AUM_TRASH_DIR="$tmp/trash" bash install.sh
          test -x "$tmp/AIUsageMenuBar.app/Contents/Resources/python/bin/python3.13"
          test -f "$tmp/AIUsageMenuBar.app/Contents/Library/LaunchAgents/io.github.kevin930326.AIUsageMenuBar.collector.plist"
      - name: 上傳 artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-${{ steps.version.outputs.version }}
          path: build/release/out/
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows App（自含式 zip，x64、ARM64）
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: 版本
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' apple/MacMenuBar/project.yml | head -1)
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "版本格式不對：$version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: dotnet test windows/tests/UsageCore.Tests
      - name: 建置與打包（Release、自含式；檢查不含 .pdb、測試組件與 Debug 專用字串）
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python -X utf8 scripts/package-windows-app.py --version $env:VERSION --out build/release/windows
      - name: 檢查產出（SHA-256、解壓後在沒有安裝 .NET 的情況下也能啟動）
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Set-Location build/release/windows
          foreach ($line in Get-Content SHA256SUMS-windows) {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash $name -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw "SHA-256 不符：$name" }
          }
          $dir = Join-Path $env:RUNNER_TEMP 'unzip-x64'
          Expand-Archive "AIUsageMonitor-windows-x64-$env:VERSION.zip" $dir
          $exe = Join-Path $dir 'AIUsageMonitor\AIUsageMonitor.exe'
          if ((Get-Item $exe).VersionInfo.ProductVersion -notlike "$env:VERSION*") { throw "版本不對：$((Get-Item $exe).VersionInfo.ProductVersion)" }
          # 自含式：不用系統的 .NET（DOTNET_ROOT 指到不存在的地方）；暫存資料夾、不改開機自動啟動、不觸發收集器
          $env:AI_USAGE_MONITOR_HOME = Join-Path $env:RUNNER_TEMP 'aum-home'
          $env:DOTNET_ROOT = Join-Path $env:RUNNER_TEMP 'no-dotnet'
          $p = Start-Process -FilePath $exe -ArgumentList '--isolated' -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "App 啟動後結束了（結束碼 $($p.ExitCode)）" }
          Start-Process -FilePath $exe -ArgumentList '--isolated', '--quit' -Wait
          if (-not $p.WaitForExit(15000)) { $p.Kill(); throw '--quit 沒有讓 App 結束' }
      - name: 上傳 artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ steps.version.outputs.version }}
          path: build/release/windows/
          if-no-files-found: error
          retention-days: 1

  draft-release:
    name: 建立草稿 Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-*"
          path: out
          merge-multiple: true
      - name: 建置來源證明
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: 建立草稿
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "AI 用量 $TAG" --notes "草稿：確認檔案、SHA256SUMS 與 SHA256SUMS-windows 後再按發布。安裝方式見 README；第一次發布照 docs/release-checklist.md。"

  # 刪除這次執行的 workflow artifact（ADR-0013 第 7 節）：推 tag 時在草稿建立之後（建置或建立草稿失敗也刪），
  # pull_request 時上傳一個假的 artifact 再刪，確認權限與 API 呼叫會成功（fork 的 PR 沒有寫入權限，不跑）。
  # workflow_dispatch 的產出就是 artifact（給人下載），不刪
  delete-artifacts:
    name: 刪除這次的 artifact
    if: >-
      always() && (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    needs: [mac, windows, draft-release]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: 乾跑用的假 artifact
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p dry-run
          echo "release.yml dry run ${GITHUB_RUN_ID}" > dry-run/README.txt
      - name: 上傳假的 artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dry-run
          path: dry-run/
          retention-days: 1
      - name: 刪除並確認沒有剩下
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          list() { gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[] | "\(.id) \(.name)"'; }
          found=$(list)
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && ! grep -q ' dry-run$' <<<"$found"; then
            echo "找不到乾跑的 artifact" >&2; exit 1
          fi
          while read -r id name; do
            [ -n "$id" ] || continue
            echo "刪除 $name（$id）"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done <<<"$found"
          left=$(list)
          if [ -n "$left" ]; then echo "還有沒刪掉的 artifact：$left" >&2; exit 1; fi
          echo "這次執行的 artifact 都刪掉了"
