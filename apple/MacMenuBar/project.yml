# 用 XcodeGen 產生 Xcode 專案：cd apple/MacMenuBar && xcodegen generate
name: AIUsageMenuBar
options:
  bundleIdPrefix: io.github.kevin930326
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  UsageKit:
    path: ../UsageKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    # Sign to Run Locally：不需要 Apple 帳號，也沒有 7 天期限（docs/02-architecture.md 2.6）
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    ENABLE_HARDENED_RUNTIME: NO

targets:
  AIUsageMenuBar:
    type: application
    platform: macOS
    sources:
      - AIUsageMenuBar
      # 角色的共用動畫設定（ADR-0016 第 3 節），和 Windows 共用同一份
      - path: ../../shared/mascot-anim.json
        buildPhase: resources
    dependencies:
      - package: UsageKit
        product: UsageKit
      - package: UsageKit
        product: UsageKitUI
    info:
      path: AIUsageMenuBar/Info.plist
      properties:
        CFBundleDisplayName: AI 用量
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kevin930326.AIUsageMenuBar
        # 圖示由 scripts/render-app-icon.sh 產生
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO

