# 用 XcodeGen 產生 Xcode 專案：cd apple/iOSApp && xcodegen generate
name: AIUsageMonitor
options:
  bundleIdPrefix: io.github.kevin930326
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  UsageKit:
    path: ../UsageKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    # 免費 Apple ID 也能簽署：在 Xcode 的 Signing & Capabilities 選自己的 Team，
    # 或執行 DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  AIUsageMonitor:
    type: application
    platform: iOS
    sources:
      - AIUsageMonitor
      - Shared
    dependencies:
      - package: UsageKit
        product: UsageKit
      - package: UsageKit
        product: UsageKitUI
      - target: UsageWidget
    # App Group：中繼網址、顯示模式與最後一份資料給小工具讀；Keychain 群組是 App 自己的
    # application identifier，小工具讀得到既有的讀取密鑰。免費 Apple ID 的描述檔也包含這兩項
    entitlements:
      path: AIUsageMonitor/AIUsageMonitor.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.kevin930326.AIUsageMonitor]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.kevin930326.AIUsageMonitor]
    info:
      path: AIUsageMonitor/Info.plist
      properties:
        CFBundleDisplayName: AI 用量
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hant
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kevin930326.AIUsageMonitor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

  # Live Activity 的鎖定畫面／動態島／手錶版面（FR-8、FR-27），以及主畫面／鎖定畫面小工具
  UsageWidget:
    type: app-extension
    platform: iOS
    sources:
      - UsageWidget
      - Shared
    dependencies:
      - package: UsageKit
        product: UsageKit
      - package: UsageKit
        product: UsageKitUI
    entitlements:
      path: UsageWidget/UsageWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.kevin930326.AIUsageMonitor]
        keychain-access-groups: [$(AppIdentifierPrefix)io.github.kevin930326.AIUsageMonitor]
    info:
      path: UsageWidget/Info.plist
      properties:
        CFBundleDisplayName: AI 用量
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hant
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kevin930326.AIUsageMonitor.UsageWidget
        # supplementalActivityFamilies（FR-27 手錶版面）需要 iOS 18；App 本身仍支援 iOS 17
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
