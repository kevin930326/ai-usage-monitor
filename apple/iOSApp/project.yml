# 用 XcodeGen 產生 Xcode 專案：cd apple/iOSApp && xcodegen generate
name: AIUsageMonitor
options:
  bundleIdPrefix: io.github.kevin930326
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  UsageKit:
    path: ../UsageKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
    # 免費 Apple ID 也能簽署：在 Xcode 的 Signing & Capabilities 選自己的 Team，
    # 或執行 DEVELOPMENT_TEAM=XXXXXXXXXX xcodegen generate
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic

targets:
  AIUsageMonitor:
    type: application
    platform: iOS
    sources:
      - AIUsageMonitor
    dependencies:
      - package: UsageKit
        product: UsageKit
      - package: UsageKit
        product: UsageKitUI
    info:
      path: AIUsageMonitor/Info.plist
      properties:
        CFBundleDisplayName: AI 用量
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hant
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kevin930326.AIUsageMonitor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
